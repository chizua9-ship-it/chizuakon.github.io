<script type="text/plain" id="eng">
const PL=[['choco','ちょこ'],['purin','ぷりん'],['pan','ぱん'],['hime','ひめ'],['panpi','ぱんぴー'],['cookie','くっきー'],['vanilla','ばにら'],['milk','みるく'],['panna','ぱんな'],['ichigo','いちご'],['chipulemo','ちっぷ＆れもん'],['penta','ぺんた']],NP=12,WEEKS=10;
const AT={choco:[[0,-1],[0,1]],ichigo:[[-1,0],[1,0]],milk:[[-2,0],[2,0]]},DIAG={panpi:-1,cookie:1};
const PP={pan:[[0,-1],[0,1],[-1,0],[1,0]],hime:[[-1,-1],[1,-1],[-1,1],[1,1]],purin:[[0,-1],[0,1]],panna:[[0,-1],[0,1]],penta:[[-1,0],[1,0]]};
const A=(id,d)=>DIAG[id]!=null?[[d,DIAG[id]],[2*d,2*DIAG[id]]]:AT[id]||[];
let S;
function addBonus(S){const e=S.c.map((c,i)=>c.b?-1:i).filter(i=>i>=0);if(e.length)S.c[e[Math.random()*e.length|0]].b=1}
function init(w,h,hm,lv){S={w,H:h,c:Array.from({length:w*h},()=>({o:0,g:0,k:null,i:null,b:0})),rem:Array(NP).fill(1),u:[0,0,0],t:1,f:1,rd:1,hm,bl:[lv,lv,lv],fx:0,af:0,over:0,msg:'',li:-1};addBonus(S)}
function tp(S,x,y,p,atk,pen){if(x<0||y<0||x>=S.w||y>=S.H)return 0;const c=S.c[y*S.w+x];
 if(c.g&&c.o!=p){c.g=0;if(!pen)return 0}
 if(c.k!=null&&c.k!=p){if(!atk)return 0;c.k=null;c.i=null}c.o=p;return 1}
function place(S,i,id,p,d){const x=i%S.w,y=i/S.w|0,c=S.c[i],own=c.o==p;let f=0;c.k=p;c.i=id;c.o=p;
 if(id=='purin'||id=='vanilla'||id=='chipulemo')for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
  const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=S.w||Y>=S.H||(!dx&&!dy))continue;const n=S.c[Y*S.w+X];
  if(id=='purin'){if(n.g&&n.o!=p){n.g=0;n.o=p;if(n.k!=null&&n.k!=p){n.k=null;n.i=null}f=1}}
  else if(id=='vanilla'){if(n.o&&n.o!=p&&n.k==null){if(n.g)n.g=0;else{n.o=p;f=1}}}
  else if(n.o||n.k!=null){if(n.g&&n.o!=p)n.g=0;else{n.k=null;n.i=null;n.o=0;n.g=0;f=1}}}
 A(id,d?d[0]:1).forEach(o=>f+=tp(S,x+o[0],y+o[1],p,1));
 (PP[id]||[]).forEach(o=>tp(S,x+o[0],y+o[1],p,0));
 if(id=='penta'&&own)PP.penta.forEach(o=>{const X=x+o[0],Y=y+o[1];if(X<0||Y<0||X>=S.w||Y>=S.H)return;const n=S.c[Y*S.w+X];if(n.o==p&&!n.g)n.g=1});
 return f}
const ok=(S,i,p,id)=>{const c=S.c[i];return c.k==null&&(!c.o||c.o==p||id=='panna'&&!c.g)};
const canMove=(S,p)=>S.c.some((_,i)=>ok(S,i,p))||S.rem[8]&&S.c.some((_,i)=>ok(S,i,p,'panna'));
const cnt=(S,p)=>S.c.reduce((a,c)=>a+(c.o==p?(c.b?3:1):0),0);
function adv(S){if(!S.rem.some(x=>x)){S.rd++;S.rem.fill(1);S.u=[0,0,0];S.f=S.f%3+1;S.t=S.f;if(S.rd<=WEEKS)addBonus(S)}else S.t=S.t%3+1;
 if(S.rd>WEEKS||S.c.every(c=>c.o)){S.over=1;return}
 for(let k=0;k<3;k++){if(canMove(S,S.t))return;S.t=S.t%3+1}S.over=1}
function apply(S,i,pi,d){const id=PL[pi][0],own=S.c[i].o==S.t;S.af=place(S,i,id,S.t,d);S.li=i;
 S.msg=id=='penta'&&own?'🛡 ぺんた：左右にシールド付与':id=='purin'&&S.af?'💥 シールド貫通！':id=='chipulemo'&&S.af?'🍋 3×3をリセット！':'';
 S.rem[pi]=0;S.u[S.t-1]++;S.fx++;adv(S)}
// ---- bot ----
const cl=S=>({...S,c:S.c.map(q=>({...q})),rem:[...S.rem],u:[...S.u]});
const mkey=m=>m.i+'-'+m.pi+'-'+(m.d?m.d.join():'');
function ev(T,p){let a=[0,0,0,0],sh=0;T.c.forEach(c=>{if(c.o){a[c.o]+=c.b?3:1;if(c.g)sh+=c.o==p?.5:-.35}});return a[p]-(a[1]+a[2]+a[3]-a[p])*.5+sh}
function moves(S,p){const r=[];S.c.forEach((c,i)=>S.rem.forEach((q,pi)=>{if(!q||!ok(S,i,p,PL[pi][0]))return;
 if(DIAG[PL[pi][0]]!=null)r.push({i,pi,d:[1,0]},{i,pi,d:[-1,0]});else r.push({i,pi,d:null})}));return r}
const scored=(p,n,st=S)=>moves(st,p).map(m=>{const T=cl(st);place(T,m.i,PL[m.pi][0],p,m.d);return[ev(T,p)+Math.random()*.3,m]}).sort((a,b)=>b[0]-a[0]).slice(0,n);
function gain(T,i,id,q,d){const x=i%T.w,y=i/T.w|0,c0=T.c[i];let g=0;if(c0.o!=q)g+=c0.b?3:1;
 const chk=(dx,dy,atk,w)=>{const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=T.w||Y>=T.H)return;const c=T.c[Y*T.w+X],pr=c.g&&c.o!=q;
  if(w=='l'){if(pr)return;if(c.o)g+=(c.o==q?-1:1)*(c.b?3:1);if(c.k!=null)g+=c.k==q?-.4:.4;return}
  if(w=='v'){if(!(c.o&&c.o!=q&&c.k==null)||pr)return;g+=c.b?3:1;return}
  if(w=='p'){if(pr)g+=(c.b?3:1)*1.5+1+(c.k!=null&&c.k!=q?.4:0);return}
  if(pr)return;if(c.k!=null&&c.k!=q&&!atk)return;if(c.o!=q)g+=(c.b?3:1)*(c.o?1.5:1)};
 A(id,d?d[0]:1).forEach(o=>chk(o[0],o[1],1));(PP[id]||[]).forEach(o=>chk(o[0],o[1],0));
 if(id=='vanilla'||id=='chipulemo'||id=='purin')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)chk(a,b,1,id=='chipulemo'?'l':id=='vanilla'?'v':'p');
 if(id=='penta'&&c0.o==q)g+=1.6;return g}
function play(s,H=60){const T=cl(s),N=T.c.length;
 for(let k=0;k<H&&!T.over;k++){const q=T.t;let bi=-1,bj=-1,bd=null,bg=-1e9;
  for(let g=0;g<10;g++){const i=Math.random()*N|0,a=[];for(let j=0;j<NP;j++)if(T.rem[j]&&ok(T,i,q,PL[j][0]))a.push(j);if(!a.length)continue;
   const j=a[Math.random()*a.length|0],id=PL[j][0];let d=null,gg;
   if(DIAG[id]!=null){const g1=gain(T,i,id,q,[1,0]),g2=gain(T,i,id,q,[-1,0]);d=g1>=g2?[1,0]:[-1,0];gg=Math.max(g1,g2)}else gg=gain(T,i,id,q,null);
   gg+=Math.random()*1.1;if(gg>bg){bg=gg;bi=i;bj=j;bd=d}if(Math.random()<.12)break}
  if(bj<0){const mv=moves(T,q);if(!mv.length)break;const m2=mv[Math.random()*mv.length|0];bi=m2.i;bj=m2.pi;bd=m2.d}
  apply(T,bi,bj,bd)}
 return T}
function rr(s){const T=play(s),a=[0,0,0,0],r=[0];T.c.forEach(c=>{if(c.o)a[c.o]+=c.b?3:1});
 for(let q=1;q<4;q++)r[q]=Math.tanh((a[q]-Math.max(...[1,2,3].filter(o=>o!=q).map(o=>a[o])))/25);return r}
function cands(p,st=S){const a=scored(p,9999,st),r=a.slice(0,26),seen=new Set(r.map(x=>x[1].pi));a.slice(26).forEach(x=>{if(!seen.has(x[1].pi)){seen.add(x[1].pi);r.push(x)}});return r}
// MCTS(3人用maxⁿ・木は深さ4まで)
function mcts(p,st=S,ex,list){const mk=(s,d,m)=>({s,d,m,n:0,w:[0,0,0,0],ch:[],un:null,over:s.over});
 const root=mk(cl(st),0,null);root.un=(list||cands(p,st).map(x=>x[1])).slice();let nodes=1;
 if(ex){const kk=mkey(ex);root.un=root.un.filter(m=>mkey(m)!=kk);root.un.unshift(ex)}
 const top=s=>moves(s,s.t).map(m=>[gain(s,m.i,PL[m.pi][0],s.t,m.d)+Math.random()*.6,m]).sort((a,b)=>b[0]-a[0]).slice(0,10).map(x=>x[1]);
 const it=()=>{let nd=root;const path=[nd];
  while(!nd.over){
   if(!nd.un)nd.un=top(nd.s);
   if(nd.d<4&&nodes<3000&&nd.un.length&&(nd===root||nd.ch.length<Math.ceil(Math.sqrt(nd.n+1)))){
    const m=nd.un.shift(),s=cl(nd.s);apply(s,m.i,m.pi,m.d);const c=mk(s,nd.d+1,m);nd.ch.push(c);nodes++;nd=c;path.push(c);break}
   if(!nd.ch.length)break;
   const q=nd.s.t,l=Math.log(nd.n+1);let b=-1e9,bc;
   for(const c of nd.ch){const u=c.w[q]/c.n+.95*Math.sqrt(l/c.n);if(u>b){b=u;bc=c}}
   nd=bc;path.push(nd)}
  const r=rr(nd.s);path.forEach(x=>{x.n++;for(let q=1;q<4;q++)x.w[q]+=r[q]})};
 return{it,root,stats:()=>root.ch.map(c=>({k:mkey(c.m),m:c.m,n:c.n,w:c.w[p]}))}}
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ENG=document.getElementById('eng').textContent;{const e=document.createElement('script');e.text=ENG;document.head.appendChild(e)}
const $=s=>document.querySelector(s),PN=['A','B','C'],COL=['#e8505b','#3b82f6','#2fae66'],PRO_MS=10000;
const DS={choco:'上下を塗り攻撃(敵駒を倒す・合計3)',purin:'縦に塗る(合計3)+3×3内のシールドマスに色塗り攻撃(シールド貫通)',pan:'十字に塗る(合計5)',hime:'バツ型に塗る(合計5)',panpi:'右スライド=右斜め上/左=左斜め上に攻撃(合計3)',cookie:'右スライド=右斜め下/左=左斜め下に攻撃(合計3)',vanilla:'3x3の敵色のみ自色に(駒のある所は不変)',milk:'1マス飛ばしの横攻撃 👊◾🍼◾👊(合計3)',panna:'敵色の上にも置ける・上下を塗る(合計3)',ichigo:'左右を塗り攻撃(合計3)',chipulemo:'設置マスを除く3×3の駒と色をリセット(消滅・無色)',penta:'左右を塗る(合計3)。自色のマスに置くと左右に1回耐えるシールド🛡'};
const snd=n=>{const a=new Audio(n+'.wav');a.play().catch(()=>{})};
const bgm=new Audio('bgm.wav');bgm.loop=true;bgm.volume=.35;
for(let i=4;i<=12;i++){$('#w').add(new Option(i,i,i==10,i==10));$('#h').add(new Option(i,i,i==6,i==6))}
let pv=-1,mode='bot',me=1,sel=-1,dr=null,peer,conns=[],slots=[],cn,host=true,lastFx=0,rank=0,bz=0,rext='',prac=0,hint=[],hz=0,fb='',hist=[],gh=null,tick=0,lite=false,heat=0,askT=4,ast='',pst={a:0,b:0,c:0,d:0,s:0,n:0};
try{lite=localStorage.ccbl=='1'}catch(e){}
const applyLite=()=>{document.body.classList.toggle('lite',lite);try{localStorage.ccbl=lite?1:0}catch(e){}};
$('#lite').checked=lite;applyLite();$('#lite').onchange=e=>{lite=e.target.checked;applyLite()};
// ---- ランク ----
const TIERS=[[0,'ブロンズI',[200,20,40]],[500,'ブロンズII',[200,20,40]],[750,'シルバーI',[150,25,50]],[1000,'シルバーII',[150,25,50]],[1250,'ゴールドI',[125,30,60]],[1500,'ゴールドII',[125,30,60]],[1700,'プラチナI',[70,45,65]],[2000,'プラチナII',[70,45,65]],[2500,'プラチナIII',[70,45,65]],[3000,'プロランク',[30,50,70]],[3500,'伝説',[0,0,0]]];
const tier=pt=>TIERS.filter(x=>pt>=x[0]).pop();
let R={pt:250,w:0,p:0};try{R=JSON.parse(localStorage.ccb)||R}catch(e){}
const sv=()=>{try{localStorage.ccb=JSON.stringify(R)}catch(e){}};
$('#rk').innerHTML=`🏆 ${tier(R.pt)[1]} ${R.pt}pt ／ ${R.w}勝 ${R.p}戦`;
const mo=()=>document.querySelector('[name=m]:checked').value;
document.querySelectorAll('[name=m]').forEach(r=>r.onchange=()=>{const m=mo();$('#pn').classList.toggle('hide',m=='bot');$('#on').classList.toggle('hide',m!='online');$('#go').classList.toggle('hide',m=='online')});
const hmOf=n=>[1,1,1].map((_,i)=>i<n?1:0);
function botGame(w,h,lv){me=1+Math.random()*3|0;const hm=[0,0,0];hm[me-1]=1;init(w,h,hm,lv)}
function begin(){bgm.play().catch(()=>{});$('#menu').classList.add('hide');$('#game').classList.remove('hide');render();if(host)kick()}
$('#go').onclick=()=>{mode=mo();rank=0;prac=0;const w=+$('#w').value,h=+$('#h').value,lv=$('#lv').value;if(mode=='bot')botGame(w,h,lv);else{me=1;init(w,h,hmOf(+$('#np').value),lv)}begin()};
document.querySelectorAll('.rk').forEach(b=>b.onclick=()=>{mode='bot';rank=+b.dataset.m;prac=0;botGame(+b.dataset.w,+b.dataset.h,R.pt>=1250?'pro':'normal');begin()});
$('#prac').onclick=()=>{mode='bot';rank=0;prac=1;hist=[];botGame(12,8,$('#lv').value);begin()};

// ---- 進行 ----
function act(i,pi,who,d){if(S.over||!S.rem[pi]||!ok(S,i,S.t,PL[pi][0])||(who!=='bot'&&(!S.hm[S.t-1]||who!==S.t)))return;apply(S,i,pi,d);sync()}
function sync(){conns.forEach(c=>c.open&&c.send({t:'s',S}));render();sfx();kick()}
function sfx(){if(S.fx!=lastFx){lastFx=S.fx;snd('setti');if(S.af)setTimeout(()=>snd('attack'),150)}}
function kick(){if(host&&!S.over&&!S.hm[S.t-1])setTimeout(bot,300)}
function bot(){if(S.over||S.hm[S.t-1]||bz)return;const p=S.t;if(S.bl[p-1]=='pro')return pro();
 const m=scored(p,1)[0][1],f0=S.fx;bz=1;setTimeout(()=>{if(S.fx!=f0){bz=0;return}gh=m;render();setTimeout(()=>{bz=0;gh=null;if(S.fx==f0)act(m.i,m.pi,'bot',m.d)},900)},700+Math.random()*1000)}
// ---- 並列思考(Web Worker・使えない環境では単独で思考) ----
const WG=`onmessage=e=>{const d=e.data;S=d.st;const M=mcts(d.p,d.st,null,d.list),t0=Date.now();let lp=0;const step=()=>{const e2=Date.now()+40;while(Date.now()<e2)M.it();const now=Date.now();if(now-t0>=d.ms){postMessage({t:'d',s:M.stats()});return}if(now-lp>700){lp=now;postMessage({t:'p',s:M.stats()})}setTimeout(step,0)};step()}`;
let pool=[],dead=0,chain=Promise.resolve();
function getPool(){if(dead)return[];if(pool.length)return pool;try{const u=URL.createObjectURL(new Blob([ENG+'\n'+WG],{type:'text/javascript'})),n=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1));pool=Array.from({length:n},()=>new Worker(u))}catch(e){dead=1;pool=[]}return pool}
function merge(a){const m={};a.forEach(s=>s&&s.forEach(x=>{const o=m[x.k]||(m[x.k]={k:x.k,m:x.m,n:0,w:0});o.n+=x.n;o.w+=x.w}));return Object.values(m)}
function run(st,p,ms,list,prog){return new Promise(res=>{
 const single=()=>{const M=mcts(p,st,null,list),t0=Date.now(),step=()=>{const e=Date.now()+30;while(Date.now()<e)M.it();prog&&prog(M.stats());Date.now()-t0<ms?setTimeout(step,0):res(M.stats())};step()};
 const P=getPool();if(!P.length)return single();
 const last=P.map(()=>null);let done=0,bad=0;
 P.forEach((w,j)=>{w.onmessage=e=>{if(bad)return;last[j]=e.data.s;if(e.data.t=='d'){if(++done==P.length)res(merge(last))}else prog&&prog(merge(last))};
  w.onerror=()=>{if(bad)return;bad=1;P.forEach(x=>x.terminate());pool=[];dead=1;single()};w.postMessage({st,p,ms,list})})})}
function think(st,p,ms,list,prog){const r=chain.then(()=>run(st,p,ms,list,prog));chain=r.catch(()=>{});return r}
const cyc=(s,o)=>{const now=Date.now();if(now-o.t0>o.dl&&now-o.lg>900){o.lg=now;const cs=s.slice().sort((a,b)=>b.n-a.n).slice(0,5);if(cs.length){gh=cs[tick++%cs.length].m;render()}}};
async function pro(){bz=1;S.think=1;render();const p=S.t,f0=S.fx,st=cl(S),o={t0:Date.now(),dl:700+Math.random()*1000,lg:0};
 const list=cands(p,st).map(x=>x[1]);
 const r=await think(st,p,PRO_MS,list,s=>{if(S.fx==f0)cyc(s,o)});
 bz=0;S.think=0;gh=null;if(S.fx!=f0)return;
 const c=r.sort((a,b)=>b.n-a.n||b.w/b.n-a.w/a.n)[0],m=c?c.m:list[0];act(m.i,m.pi,'bot',m.d)}

// ---- 練習(AI視点) ----
const rdr=d=>d?(d[0]>0?'→':'←'):'';
const why=(m,p)=>{const T=cl(S);place(T,m.i,PL[m.pi][0],p,m.d);const g=cnt(T,p)-cnt(S,p),l=[1,2,3].filter(q=>q!=p).reduce((a,q)=>a+cnt(S,q)-cnt(T,q),0);return `自分${g>=0?'+':''}${g} / 相手-${l}`};
async function ask(){if(!S||S.over||!mine()||hz)return;hz=1;hint=[];render();const p=S.t,f0=S.fx,st=cl(S),o={t0:Date.now(),dl:700+Math.random()*1000,lg:0};
 const list=cands(p,st).map(x=>x[1]);
 const r=await think(st,p,askT*1000,list,s=>{if(S.fx==f0)cyc(s,o)});
 hz=0;gh=null;if(S.fx!=f0)return;
 hint=r.filter(c=>c.n>=3).sort((a,b)=>b.n-a.n).slice(0,3).map(c=>({...c.m,v:(c.w/c.n+1)*50,n:c.n,fx:f0,why:why(c.m,p)}));render()}
async function evalMove(ps,mv,p){fb='🤔 AIがあなたの手を評価中…';render();
 const list=cands(p,ps).map(x=>x[1]).filter(m=>mkey(m)!=mkey(mv));list.unshift(mv);
 const r=await think(ps,p,1800,list),v=c=>c.w/c.n,me2=r.find(c=>c.k==mkey(mv)),best=r.filter(c=>c.n>=5).sort((a,b)=>v(b)-v(a))[0];
 if(!me2||!best){fb='';render();return}
 const a=(v(me2)+1)*50,b=(v(best)+1)*50,d=Math.max(0,b-a),cl2=d<2?'a':d<6?'b':d<12?'c':'d';pst[cl2]++;pst.s+=d;pst.n++;
 const nm=m=>`${PL[m.pi][1]}${DIAG[PL[m.pi][0]]!=null?rdr(m.d):''}(${m.i%ps.w+1},${(m.i/ps.w|0)+1})`;
 fb=`📝 あなたの手 ${nm(mv)}：有利度${a.toFixed(0)}% ／ AIの最善 ${nm(best.m)}：${b.toFixed(0)}% → ${d<2?'🎯ほぼ最善！':d<6?'👍良い手':d<12?'😅惜しい':'💦もっと良い手がありました'}`;render()}
function assess(){if(!S||S.over||ast=='…')return;ast='…';render();const st=cl(S),N=300,w=[0,0,0,0],sc=[0,0,0,0];let k=0;
 const step=()=>{const e=Date.now()+30;while(Date.now()<e&&k<N){const T=play(st,400),a=[0,0,0,0];T.c.forEach(c=>{if(c.o)a[c.o]+=c.b?3:1});const m=Math.max(a[1],a[2],a[3]),ws=[1,2,3].filter(q=>a[q]==m);ws.forEach(q=>w[q]+=1/ws.length);for(let q=1;q<4;q++)sc[q]+=a[q];k++}
  if(k<N)setTimeout(step,0);else{ast=[1,2,3].map(q=>`<span style="color:${COL[q-1]}">${PN[q-1]} ${(w[q]/N*100).toFixed(0)}%(平均${(sc[q]/N).toFixed(0)}マス)</span>`).join(' ／ ');render()}};step()}
function undo(){if(!prac||!hist.length||hz)return;S=hist.pop();sel=-1;pv=-1;dr=null;hint=[];fb='';ast='';rfx=-1;PO=[];lastFx=S.fx;bz=0;gh=null;sync()}
$('#ai').onclick=e=>{const t=e.target.closest('[data-h],#ask,#undo,#heat,#asm');if(!t)return;
 if(t.id=='ask')ask();else if(t.id=='undo')undo();else if(t.id=='heat'){heat^=1;render()}else if(t.id=='asm')assess();
 else{const h=hint[+t.dataset.h];if(h&&mine()){sel=h.pi;pv=h.i;dr=h.d;render()}}};
$('#ai').onchange=e=>{if(e.target.id=='at'){askT=+e.target.value}};

// ---- 性能パネル ----
$('#rg').innerHTML=PL.map(([id,n])=>{let h='';for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){let c='',t='';
 if(!x&&!y)c='me',t='●';
 else if(A(id,1).some(d=>d[0]==x&&d[1]==y))c='at';
 else if((PP[id]||[]).some(d=>d[0]==x&&d[1]==y))c='pt';
 else if(['purin','vanilla','chipulemo'].includes(id)&&Math.abs(x)<2&&Math.abs(y)<2)c='sp';
 h+=`<i class="${c}">${t}</i>`}
 return `<div class="rb"><b>${n}</b><div class="rm">${h}</div>${DS[id]}</div>`}).join('');

// ---- 画面 ----
const mine=()=>S.hm[S.t-1]&&(mode=='local'||me==S.t);
const dflt=()=>sel>=0&&DIAG[PL[sel][0]]!=null?[1,0]:null;
function prev(){if(pv<0||sel<0)return null;const T=cl(S);place(T,pv,PL[sel][0],S.t,dr);return T}
function tap(i){if(!S||S.over||sel<0||!mine()||!ok(S,i,S.t,PL[sel][0]))return;
 if(pv==i){const p=sel,d=dr;pv=-1;sel=-1;dr=null;
  if(prac){hist.push(cl(S));const ps=cl(S);hint=[];fb='';ast='';act(i,p,S.t,d);evalMove(ps,{i,pi:p,d},ps.t);return}
  if(host)act(i,p,S.t,d);else{cn.send({t:'p',i,p,d});render()}return}
 pv=i;dr=dflt();render()}
function swp(i,dx){if(!S||S.over||sel<0||!mine()||!ok(S,i,S.t,PL[sel][0]))return;pv=i;dr=dflt();if(DIAG[PL[sel][0]]!=null)dr=[dx>0?1:-1,0];render()}
let psx;
$('#g').onpointerdown=e=>{const c=e.target.closest('.c');psx=c?[e.clientX,e.clientY,+c.dataset.i]:null};
$('#g').onpointerup=e=>{if(!psx)return;const dx=e.clientX-psx[0],dy=e.clientY-psx[1],i=psx[2];psx=null;Math.abs(dx)<14&&Math.abs(dy)<14?tap(i):swp(i,dx)};
$('#info').onclick=e=>{if(e.target.id=='tg'&&dr){dr=[-dr[0],0];render()}if(e.target.id=='lt'){lite=!lite;$('#lite').checked=lite;applyLite();render()}};
let PO=[],rfx=-1;
function render(){if(!S)return;
 if(hint.length&&hint[0].fx!=S.fx)hint=[];
 if(!mine()||S.over||(sel>=0&&!S.rem[sel]))sel=-1;if(sel<0||(pv>=0&&!ok(S,pv,S.t,PL[sel][0])))pv=-1;
 const T0=prev(),G=!T0&&gh&&(S.think||hz||bz)?cl(S):null;if(G)place(G,gh.i,PL[gh.pi][0],S.t,gh.d);
 const T=T0||G,B=T||S,pvx=T0?pv:G?gh.i:-1,sid=sel>=0?PL[sel][0]:'';let pt='';
 if(T0){const p=S.t,gain=cnt(T,p)-cnt(S,p),lost=[1,2,3].filter(q=>q!=p).map(q=>[q,cnt(S,q)-cnt(T,q)]).filter(a=>a[1]>0).map(a=>PN[a[0]-1]+'-'+a[1]).join(' '),
  kill=S.c.filter((c,i)=>c.k!=null&&T.c[i].k==null).length,sn=T.c.filter((c,i)=>c.g&&!S.c[i].g).length,sr=S.c.filter((c,i)=>c.g&&!T.c[i].g).length,wipe=S.c.filter((c,i)=>c.o&&!T.c[i].o).length;
  pt=`👁 プレビュー：${PL[sel][1]}<br>自分 ${gain>=0?'+':''}${gain}マス${lost?' / 相手 '+lost:''}${wipe?' / 無色化 '+wipe:''}${kill?' / 駒消滅 '+kill:''}${sn?' / 🛡付与 '+sn:''}${sr?' / 💥シールド消費 '+sr:''}<br>`+
  (DIAG[sid]!=null?`<button id="tg">向き ${rdr(dr)} 切替</button> <small>(横スライドでも変更)</small><br>`:'')+`<small>同じマスをもう一度タップで配置・別のマスや駒で変更</small>`}
 $('#hd').innerHTML=[1,2,3].map(p=>`<div class="chip ${S.t==p?'on':''}" style="background:${COL[p-1]}">${PN[p-1]}${S.hm[p-1]?'':'🤖'}${mode!='local'&&me==p&&S.hm[p-1]?'(あなた)':''}<br>${cnt(S,p)}マス</div>`).join('');
 $('#info').innerHTML=`第${Math.min(S.rd,WEEKS)}週/${WEEKS} ・ 先手${PN[S.f-1]} ・ 残りコマ ${S.rem.filter(x=>x).length}/${NP}<br><b style="color:${COL[S.t-1]}">${PN[S.t-1]}の番</b>${S.think?' 🤖考え中…':''}${T0?'<br>'+pt:G?`<br>🤖 ${PL[gh.pi][1]}${DIAG[PL[gh.pi][0]]!=null?rdr(gh.d):''}を(${gh.i%S.w+1},${(gh.i/S.w|0)+1})に置くか検討中…`:mine()?'：コマを選んでマスをタップ':''}${!T&&S.msg?'<br>'+S.msg:''}<br><small><a id="lt" style="cursor:pointer;text-decoration:underline">⚡軽量化 ${lite?'ON':'OFF'}(タップで切替)</a></small>`;
 $('#ai').classList.toggle('hide',!prac);
 if(prac)$('#ai').innerHTML=`<b>🎓 AIの視点(練習)</b><br><button id="ask">🤖AIに相談</button><select id="at">${[2,4,8].map(t=>`<option value="${t}" ${t==askT?'selected':''}>${t}秒</option>`).join('')}</select><button id="undo">↩️1手戻す</button><button id="heat">🔥ヒートマップ ${heat?'ON':'OFF'}</button><button id="asm">📊形勢判断</button>${hz?'<br>🤔 AIが読んでいます…':''}`+
  hint.map((h,k)=>`<div class="ht" data-h="${k}">${'①②③'[k]} ${PL[h.pi][1]}${DIAG[PL[h.pi][0]]!=null?rdr(h.d):''} → (${h.i%S.w+1},${(h.i/S.w|0)+1}) 有利度${h.v.toFixed(0)}% ・${h.why} <small>(タップで反映)</small></div>`).join('')+
  (fb?`<div style="font-size:12px;text-align:left">${fb}</div>`:'')+(ast?`<div class="ht">📊 勝率の目安：${ast}</div>`:'')+
  (pst.n?`<div style="font-size:12px;text-align:left">成績 🎯${pst.a} 👍${pst.b} 😅${pst.c} 💦${pst.d} ／ 平均ロス ${(pst.s/pst.n).toFixed(1)}%</div>`:'')+
  `<div style="font-size:11px;color:#888;text-align:left">コマを選ぶ→🔥で「そのコマを置いた時の得」が各マスに出ます。</div>`;
 const hx={};hint.forEach((h,k)=>{if(hx[h.i]==null)hx[h.i]=k});
 const hmv={};let hmx=1;if(prac&&heat&&mine()&&sel>=0){const id=PL[sel][0];S.c.forEach((c,i)=>{if(ok(S,i,S.t,id)){const v=DIAG[id]!=null?Math.max(gain(S,i,id,S.t,[1,0]),gain(S,i,id,S.t,[-1,0])):gain(S,i,id,S.t,null);hmv[i]=v;hmx=Math.max(hmx,v)}})}
 const g=$('#g');g.style.gridTemplateColumns=`repeat(${S.w},1fr)`;
 g.innerHTML=B.c.map((c,i)=>{const z=S.c[i];return `<div class="c ${c.b?'bn':''} ${G&&i==gh.i?'gp':''} ${T?(i==pvx?'pvc':c.o!=z.o||c.g!=z.g||c.k!=z.k?'ch':''):mine()&&sel>=0&&ok(S,i,S.t,PL[sel][0])?'v':''}" data-i="${i}" style="background:${c.o?COL[c.o-1]:'#f6f1ee'}">${c.b?'<em>★3</em>':''}${hx[i]!=null?`<u class="hn">${'①②③'[hx[i]]}</u>`:''}${c.k!=null?`<img class="p" src="${c.i}.png" alt="${PL.find(q=>q[0]==c.i)[1]}" onerror="this.outerHTML='<span>'+this.alt+'</span>'"><b style="background:${COL[c.k-1]}">${PN[c.k-1]}</b>`:''}${c.g?`<img class="gs" src="shield.png" onerror="this.outerHTML='<span class=gt>🛡</span>'">`:''}${hmv[i]!=null?`<u class="hm" style="background:rgba(255,200,0,${(.12+.6*Math.max(0,hmv[i])/hmx).toFixed(2)})">${hmv[i].toFixed(0)}</u>`:''}</div>`}).join('');
 $('#tr').innerHTML=PL.map((q,i)=>`<button class="pc ${S.rem[i]?'':'used'} ${sel==i?'sel':''}" data-p="${i}"><img src="${q[0]}.png" alt="" onerror="this.remove()"><br>${q[1]}</button>`).join('');
 $('#pan').innerHTML=`今週の残り：${S.rem.map((r,i)=>r?PL[i][1]:'').filter(x=>x).join('、')||'なし'}<br>今週の使用回数：`+[1,2,3].map(p=>`<span style="color:${COL[p-1]}">${PN[p-1]} ${S.u[p-1]}回</span>`).join(' ')+`<br>※コマは全員で共有・1週に各1回(${NP}個で週終了、先手は毎週A→B→Cと交代)`;
 if(rfx!=S.fx){const first=rfx<0;rfx=S.fx;const ch=[];S.c.forEach((c,i)=>{if(PO.length&&PO[i]!=c.o)ch.push([i,c.o?COL[c.o-1]:'#fff'])});PO=S.c.map(c=>c.o);
  if(!first&&ch.length&&!lite){ch.forEach(a=>g.children[a[0]].classList.add('pp'));spawn(ch)}}
 if(S.over){const n=[1,2,3].map(p=>cnt(S,p)),m=Math.max(...n),w=n.map((v,i)=>v==m?PN[i]:'').join(''),pl=1+n.filter(v=>v>n[me-1]).length;
  if(rank&&!rext){const t=tier(R.pt),b=R.pt,d=pl==1?Math.round(t[2][0]*rank):-t[2][pl-1];R.pt=Math.max(0,R.pt+d);R.p++;if(pl==1)R.w++;sv();rext=`<br><small>🏆 ${tier(b)[1]} ${b}pt → ${tier(R.pt)[1]} ${R.pt}pt (${d>=0?'+':''}${d})</small>`}
  $('#ovt').innerHTML=`終了！<br>${w.length>1?'引き分け '+w:'勝者 '+w+'チーム'}<br><small>A:${n[0]} B:${n[1]} C:${n[2]}</small>${mode!='local'?`<br><small>あなた：${PN[me-1]}チーム ${pl}位</small>`:''}${rext}`;$('#ov').style.display='flex'}}
$('#tr').onclick=e=>{const b=e.target.closest('.pc');if(b&&S&&mine()&&S.rem[+b.dataset.p]){const n=+b.dataset.p;if(sel==n){sel=-1;pv=-1}else{sel=n;dr=dflt()}render()}};

// ---- インク演出 ----
const cv=$('#fx'),cx=cv.getContext('2d');let P=[],raf=0,lt=0;
function spawn(ch){const g=$('#g'),W=g.clientWidth,H=g.clientHeight;cv.width=W;cv.height=H;const cw=W/S.w,chh=H/S.H,pos=i=>[(i%S.w+.5)*cw,((i/S.w|0)+.5)*chh];
 ch.forEach(([i,col])=>{const o=pos(S.li<0?i:S.li),t=pos(i);
  for(let k=0;k<5;k++)P.push({t:-Math.random()*.15,d:.45+Math.random()*.25,o,tg:[t[0]+(Math.random()-.5)*cw*.5,t[1]+(Math.random()-.5)*chh*.5],col,r:3+Math.random()*4,arc:30+Math.random()*40});
  P.push({sp:1,t:-.4,d:.7,x:t[0],y:t[1],col,R:cw*.42,bl:Array.from({length:7},()=>[(Math.random()-.5)*cw*1.1,(Math.random()-.5)*chh*1.1,2+Math.random()*cw*.16])})});
 if(!raf)raf=requestAnimationFrame(loop)}
function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||.016);lt=ts;cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(p=>{p.t+=dt;if(p.t<0)return true;const u=p.t/p.d;if(u>=1)return false;
  if(p.sp){cx.globalAlpha=(1-u)*.8;cx.fillStyle=p.col;const e=Math.min(1,u*3);cx.beginPath();cx.arc(p.x,p.y,p.R*e,0,7);cx.fill();p.bl.forEach(b=>{cx.beginPath();cx.arc(p.x+b[0]*e,p.y+b[1]*e,b[2],0,7);cx.fill()})}
  else{cx.globalAlpha=1;cx.fillStyle=p.col;const x=p.o[0]+(p.tg[0]-p.o[0])*u,y=p.o[1]+(p.tg[1]-p.o[1])*u-Math.sin(Math.PI*u)*p.arc;cx.beginPath();cx.arc(x,y,p.r*(1-.3*u),0,7);cx.fill()}
  return true});cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}

// ---- オンライン(PeerJS / P2P) ----
$('#host').onclick=()=>{mode='online';host=true;rank=0;prac=0;const n=+$('#np').value,code=String(1000+Math.random()*9000|0),perm=[1,2,3].sort(()=>Math.random()-.5);
 me=perm[0];slots=perm;const hm=[0,0,0];perm.slice(0,n).forEach(s=>hm[s-1]=1);init(+$('#w').value,+$('#h').value,hm,$('#lv').value);
 $('#st').textContent=`部屋コード【${code}】 待機中… (ゲスト${n-1}人)`;peer=new Peer('ccb'+code);
 peer.on('connection',c=>{if(conns.length>=n-1)return;conns.push(c);const id=conns.length,sl=slots[id];
  c.on('open',()=>{c.send({t:'y',me:sl});if(conns.length==n-1)setTimeout(()=>{begin();sync()},300)});
  c.on('data',m=>{if(m.t=='p')act(m.i,m.p,sl,m.d)})});
 peer.on('error',e=>$('#st').textContent='エラー:'+e.type)};
$('#join').onclick=()=>{mode='online';host=false;peer=new Peer();
 peer.on('open',()=>{cn=peer.connect('ccb'+$('#code').value.trim());$('#st').textContent='接続中…';
  cn.on('data',m=>{if(m.t=='y'){me=m.me;$('#st').textContent='ホストの開始待ち'}
   if(m.t=='s'){if(!S)begin();S=m.S;render();sfx()}})});
 peer.on('error',e=>$('#st').textContent='エラー:'+e.type)};
</script></body></html>
