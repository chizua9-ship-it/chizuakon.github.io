<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ガチャ</title>
<style>
@font-face{font-family:'AkazukinPOP';src:local('AkazukinPOP'),url('AkazukinPOP.otf') format('opentype');font-display:swap}
button,input{font-family:inherit}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7fb;--card:#ffffff;--tx:#3a2f5a;--sub:#7c6fa8;--ac:#ff6fb1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff7fb;--card:#ffffff;--tx:#3a2f5a;--sub:#7c6fa8;--ac:#ff6fb1}}
:root[data-theme="dark"]{--bg:#fff7fb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#ffd9ec,var(--bg) 65%);color:var(--tx);font-family:"AkazukinPOP",system-ui,-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;text-align:center;padding:16px}
h1{margin:8px 0 2px;font-size:26px;letter-spacing:2px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.panel{background:var(--card);border-radius:16px;padding:12px;max-width:480px;margin:0 auto 16px;box-shadow:0 4px 14px #b9a6e040}
.panel h2{font-size:14px;margin:0 0 4px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin:0 0 8px}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tg button{border:2px solid #c9bff0;background:transparent;color:var(--sub);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.tg button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tg button small{display:block;font-size:10px;font-weight:400;opacity:.85}
.btns{display:flex;gap:12px;justify-content:center;margin:8px 0}
.go{border:0;border-radius:16px;padding:16px 26px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff6fb1,#8f6bff);box-shadow:0 6px 0 #4a2f9c;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #4a2f9c}
.go.b{background:linear-gradient(135deg,#ffcf40,#ff7a3d);box-shadow:0 6px 0 #a2491b}
.sm{border:2px solid #c9bff0;background:var(--card);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:14px;cursor:pointer;margin:6px 4px}
#stat{font-size:13px;color:var(--sub)}
#ov{position:fixed;inset:0;background:rgba(255,243,250,.97);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;overflow:hidden}
#ov.on{display:flex}
.orb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--oc,#9aa4b2) 60%,#222);box-shadow:0 0 40px var(--oc,#9aa4b2);animation:shake .18s infinite,grow 1.4s forwards}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-8px,3px) rotate(-6deg)}75%{transform:translate(8px,-3px) rotate(6deg)}}
@keyframes grow{to{scale:1.5}}
.flash{position:absolute;inset:0;background:var(--oc,#fff);animation:fl .7s forwards;pointer-events:none}
@keyframes fl{from{opacity:1}to{opacity:0}}
.rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,var(--oc) 0 8deg,transparent 8deg 22deg);opacity:.35;animation:spin 6s linear infinite;mask-image:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.pt{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--oc);animation:bst .9s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.rc{position:relative;width:260px;padding:20px 14px 22px;border-radius:20px;background:linear-gradient(160deg,#fff,#e9e4ff);color:#2a2552;border:5px solid var(--oc);box-shadow:0 0 40px var(--oc);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.rc.lr{animation:pop .6s cubic-bezier(.2,1.6,.4,1),hue 1.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.rc .e{font-size:110px;line-height:1.1;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px) scale(1.06)}}
.rc .r{font-size:28px;font-weight:900;color:var(--oc);text-shadow:0 2px 0 #0003}
.rc .n{font-size:26px;font-weight:800;margin:6px 0 4px;word-break:break-all}
.rc .c{font-size:12px;opacity:.7}
.tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));color:var(--sub);font-size:13px;animation:bl 1s infinite alternate}
@keyframes bl{to{opacity:.3}}
.ur{animation:uri .5s 3}
@keyframes uri{0%,100%{transform:translate(0)}25%{transform:translate(-10px,6px)}75%{transform:translate(10px,-6px)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(92vw,420px);max-height:70vh;overflow:auto}
.gi{padding:8px 6px;border-radius:12px;background:#fff;color:#2a2552;border:3px solid var(--oc);font-weight:700;font-size:14px;animation:pop .4s both}
.gi b{display:block;color:var(--oc);font-size:12px}
.gi i{display:block;font-style:normal;font-size:40px;line-height:1.2}
#md{position:fixed;inset:0;background:rgba(255,247,252,.98);z-index:20;display:none;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));text-align:left}
#md.on{display:block}
#md .in{max-width:520px;margin:0 auto}
#md h3{margin:16px 0 6px;font-size:15px}
.x{position:sticky;top:0;float:right;border:0;background:var(--ac);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid #e3dcf7;text-align:right}
td:first-child,th:first-child{text-align:left}
.row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid #eee8fb;font-size:14px}
.row .em{font-size:24px;width:32px;text-align:center}
.row .nm{flex:1}
.row .rt{font-weight:800;min-width:34px}
.row .pc{color:var(--sub);font-size:12px;min-width:56px;text-align:right}
.off{opacity:.4}
.coin{font-size:100px;animation:flip .5s linear infinite}
@keyframes flip{to{transform:rotateY(360deg)}}
.res{font-size:44px;font-weight:900;margin:10px}
.lose{animation:shake .2s 5}
.row.sel{background:#ffe0f0;border-radius:8px;outline:2px solid var(--ac)}
.row[data-n]{cursor:pointer}
.ft{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:2px solid #c9bff0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;z-index:2}
.ft .tg{max-width:520px;margin:0 auto}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#c9bff0;margin-left:6px}
.pic{width:1em;height:1em;object-fit:contain;vertical-align:-.12em}
.rs{width:min(92vw,380px);max-height:92vh;overflow:auto;background:var(--card);border:3px solid #c9bff0;border-radius:20px;padding:16px 14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.rs h2{margin:0 0 4px;font-size:22px}
.rs .rh{font-size:20px;font-weight:900}
.rs .bt{font-size:13px;color:var(--sub);margin:2px 0 8px}
.rs .blk{background:#f4effd;border-radius:12px;padding:10px;margin:8px 0;text-align:center}
.rs .blk.g{outline:2px solid #4cd68a}
.rs .blk.l{outline:2px solid #ff6b6b}
.rs .lb{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.rs .chip{display:flex;align-items:center;justify-content:center;gap:10px}
.rs .ci{font-size:52px;line-height:1}
.rs .ct{font-size:18px;font-weight:800;text-align:left}
.rs .ct b{display:block;font-size:12px}
.rs .none{color:var(--sub);font-size:14px}
.rs .sub2{font-size:12px;color:var(--sub);margin-top:4px}
.rs hr.sp{border:0;border-top:1px dashed #cfc4f3;margin:8px 0}
.rs .bs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rs .bs .go{padding:12px;font-size:16px}
</style></head><body>
<h1>✨ ガチャ ✨</h1>
<div class="sub">出したくない区分はOFFにしてね</div>

<div class="panel">
  <h2>排出設定(ONのものだけ出る)</h2>
  <p class="note">グレーになっている区分は出ません</p>
  <div class="tg" id="tg"></div>
</div>

<div class="btns">
  <button class="go" id="g1">1回引く</button>
  <button class="go b" id="g10">10連!</button>
</div>
<div>
  <button class="sm" id="g10s">⏩ 演出スキップ10連</button>
  <button class="sm" id="bp">📊 確率を見る</button>
  <button class="sm" id="bl">📖 排出キャラ一覧</button>
  <button class="sm" id="bg">🎲 ギャンブル</button>
</div>
<div id="stat"></div>

<div id="ov"></div>
<div id="md"></div>

<script>
const RAW={
T:`LR🍫ちょこ
UR🐧ぺんた
SSR🤴一世
R🦔はりー
SR🐧ぴんこ
SR🐶ナッツ
SSR🐷ぎゅーみる
SSR🍨ばにら
SSR🌰まろん
SR🍊ぴゅーれ
UR🌈おーろら
SR🍓べりー
SR🎹かのん
SSR🌸すみれ
SSR🦜‬くるみ
SSR🐧ボルト
UR🦉こぷく
SR🍓ひより
SR🥬きゃべみ
SR🥬きゃべちゃ
SR🥕キャロット
UR🐑ひつ
SR🪑すふれ
R👑キングスライム
R👻はちみぃつぅの抜け殻
R🐼タンタン
R🐘ぱおくん一世
SR🦖とりけら
R🦎とかげ
R🐱さくら
SR☕️らて
R🥝キウイ
SR🐰うさぎ
SSR🐅あむ
SSR🍁もみじ
SSR🐈‍⬛あっぴー
SSR🦇こうもり
R🐰タワー
R🐰タワー2
SR🐱きとうねこ
SR🦙アルー
R🐘ぞうらん
R🐿べりー(リス)
R🦙アルパカ
SSR🐶しばさん
R🐰ほしろの抜け殻
R🐟ドリー
UR🪿ぺり
R🐧パープルソーダー
UR🚢せんちょー
R🍀らっきーびーすと
SR🌰初期まろん
R🟥あかよし
UR🧸しゃちょう
SR🐟ディスティニー
SSR🦉えびずく
SR🐟子ディス
SR🍍パイン
SR‎🤍しろくん
SSR🐙たこぷー
SR🍚タコライス
SR🐸レイニー
R🐧わたペンギン
R🌰デール
R🐱ホワイトタイガー`,
A:`LR🍮ぷりん
UR🍼みるく
UR🦔はりん
UR🐧ぴの
SSR🐘ぞうきん
SSR🐶ぱふぃん
SSR🐶はちみつ
SSR🐶らいばん
SSR🏠つばき
UR🍓いちご
SSR🌼わたげ
SR🐰もも
SSR⛄️ゆきみ
UR💭さっぴ
UR🐱きゃんでぃー
SSR🐷あいりす
SSR🍋れもん
SR🍼みるきー
R🐟ニモ
SR🦁ちんちんちゃん
SSR🦊かえで
SR🐱にゃんこたん
SR🐶ブラウンくん
SR🐱しょこら`,
J:`LR‪🎋‬ぱん
UR👸ひめ
UR🍪くっきー
UR🥜ぱんぴー
UR🐼ぱんな
SSR🐢おかめ
UR🦊みりん
SSR🛎️すずらん
SSR🐰ちゃっぴー
UR🐶きゃらめる
SSR🐶こ〜ひ〜
SSR🐶はく
R🥫ソーダ
SR‎🤍しろたん
SR🆗ぱんたん
UR🐼ぱんわ
R🐼ぱんこ
R🐼ぱんこな
SSR🐈‍⬛ちっぷ
R🪻らべんだー
R🌸ふらわー
SR🛐ぱんれい
SR🌰チップとデール
SSR🐷くみ
SR‎🤍ほわちゃん
R🐼しんしん
R🐼しゃんしゃん
SSR🐰うさはな`};
const ORD=['R','SR','SSR','UR','LR'];
const RATE={R:55,SR:27,SSR:11,UR:5,LR:2};
const COL={R:'#4aa3ff',SR:'#c77dff',SSR:'#ff7ab8',UR:'#ffcf40',LR:'#ff4f4f'};
const LAB={R:'R',SR:'SR',SSR:'SSR',UR:'UR ★',LR:'LR ✦'};
const ALL=[];
for(const cat in RAW)for(let s of RAW[cat].split('\n')){
 s=s.replace(/[\u200e\u202a-\u202e]/g,'').trim();if(!s)continue;
 const rar=s.match(/^(LR|UR|SSR|SR|R)/)[1];s=s.slice(rar.length);
 const emo=s.match(/^[^\u3040-\u30ff\u4e00-\u9fffA-Za-z0-9]+/)[0];
 ALL.push({rar,emo,name:s.slice(emo.length),cat});
}
let on={T:true,A:true,J:true},seen={},total=0,busy=false;
try{const s=JSON.parse(localStorage.getItem('gacha2_on')||'null');if(s)on=Object.assign(on,s);seen=JSON.parse(localStorage.getItem('gacha2_seen')||'{}');total=+localStorage.getItem('gacha2_total')||0}catch(e){}
function save(){try{localStorage.setItem('gacha2_on',JSON.stringify(on));localStorage.setItem('gacha2_seen',JSON.stringify(seen));localStorage.setItem('gacha2_total',total)}catch(e){}}
const ok=x=>on[x.cat];
const pool=()=>ALL.filter(ok);
const CATW={T:1,A:1,J:1};
function rates(){const p=pool(),cats=['T','A','J'].filter(c=>on[c]);const cw=cats.reduce((a,c)=>a+CATW[c],0)||1;const info={};
 cats.forEach(c=>{const cp=CATW[c]/cw*100,l=p.filter(x=>x.cat===c),cnt={};ORD.forEach(r=>cnt[r]=l.filter(x=>x.rar===r).length);
  const sum=ORD.reduce((a,r)=>a+(cnt[r]?RATE[r]:0),0)||1,eff={};ORD.forEach(r=>eff[r]=cnt[r]?RATE[r]/sum*100:0);info[c]={cp,cnt,eff}});
 return{p,cats,info}}
function draw(){const tg=document.getElementById('tg');tg.innerHTML='';
 [['T','T'],['A','A'],['J','J']].forEach(([k,l])=>{const b=document.createElement('button');b.className=on[k]?'on':'';b.innerHTML=l+'<small>'+(on[k]?'出る':'出ない')+'</small>';b.onclick=()=>{on[k]=!on[k];save();draw()};tg.appendChild(b)});
 const p=pool();document.getElementById('stat').textContent='排出対象 '+p.length+'体 / 累計 '+total+'回 / 獲得 '+p.filter(x=>seen[x.name]).length+'種';}
function pick(o,w){let r=Math.random()*o.reduce((a,k)=>a+w(k),0);for(const k of o){r-=w(k);if(r<0)return k}return o[o.length-1]}
function roll(fc){const {p,cats,info}=rates();const c=fc&&fc.length?pick(fc,k=>CATW[k]):pick(cats,k=>CATW[k]);const rar=pick(ORD.filter(r=>info[c].cnt[r]),r=>RATE[r]);const l=p.filter(x=>x.cat===c&&x.rar===rar);return l[Math.floor(Math.random()*l.length)]}
const IMG_DIR='img/'; // キャラ画像フォルダ: img/キャラ名.png (無ければ絵文字表示)
function pic(x){if(!x)return '';if(x.ro||!x.name)return x.emo;return '<img class="pic" src="'+IMG_DIR+encodeURIComponent(x.name)+'.png" data-e="'+x.emo+'" alt="">'}
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset&&t.dataset.e)t.replaceWith(t.dataset.e)},true);
const none=s=>'<div class="none">'+s+'</div>';
function chip(x){return '<div class="chip"><span class="ci">'+pic(x)+'</span><span class="ct"><b style="color:'+COL[x.rar]+'">'+LAB[x.rar]+'</b>'+x.name+'</span></div>'}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ov=document.getElementById('ov');
const waitTap=()=>new Promise(r=>{setTimeout(()=>{ov.onclick=()=>{ov.onclick=null;r()}},350)});
async function reveal(it,i,n,g){
 const col=COL[it.rar],idx=ORD.indexOf(it.rar);
 ov.style.setProperty('--oc','#9aa4b2');ov.innerHTML='<div class="orb"></div><div class="tap" style="animation:none">'+(i+1)+' / '+n+'</div>';
 await sleep(500);ov.style.setProperty('--oc',idx>1?COL.R:'#9aa4b2');
 await sleep(450);ov.style.setProperty('--oc',idx>0?COL[ORD[Math.max(0,idx-1)]]:'#9aa4b2');
 await sleep(450);ov.style.setProperty('--oc',col);
 let h='<div class="flash"></div>';
 if(idx>0)h+='<div class="rays"></div>';
 for(let k=0;k<12+idx*8;k++){const a=Math.random()*6.28,d=120+Math.random()*180;h+='<i class="pt" style="--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px"></i>'}
 h+='<div class="rc'+(it.rar==='LR'?' lr':'')+'"><div class="e">'+pic(it)+'</div><div class="r">'+LAB[it.rar]+'</div><div class="n">'+it.name+'</div><div class="c">'+it.cat+'</div></div>'+'<div class="tap">'+(g?'タップでリザルトへ':'タップで次へ')+'</div>';
 ov.innerHTML=h;if(idx>=3)ov.classList.add('ur');
 
 if(navigator.vibrate)navigator.vibrate(idx>=3?[80,50,80,50,200]:30);
 await waitTap();ov.classList.remove('ur');
}
async function run(n,fc,g,skip){
 if(busy)return;if(!pool().length){alert('排出対象がありません。設定をONにしてください');return}
 busy=true;const res=[];for(let i=0;i<n;i++)res.push(roll(fc));
 ov.classList.add('on');let wasNew=false;
 for(let i=0;i<n;i++){if(!skip)await reveal(res[i],i,n,g);wasNew=!seen[res[i].name];seen[res[i].name]=1;total++}
 if(g){save();draw();const x=res[0];streak.push({x:x,isNew:wasNew});
  showResult({head:'🎉 当たり!'+(streak.length>1?'('+streak.length+'連勝)':''),bet:bet,
   out:streak.map(s=>chip(s.x)).join('<hr class="sp">'),
   gain:streak.map(s=>chip(s.x)+'<div class="sub2">'+(s.isNew?'NEW! 図鑑に追加':'所持済み(図鑑は変わらず)')+'</div>').join('<hr class="sp">'),
   lose:none('なし(賭けたキャラはそのまま)'),cont:x,cats:(fc||[]).slice()});
  return}
 if(n>1){ov.style.setProperty('--oc','#fff');ov.innerHTML='<div class="grid">'+res.map((x,i)=>'<div class="gi" style="--oc:'+COL[x.rar]+';animation-delay:'+i*60+'ms"><i>'+pic(x)+'</i><b>'+LAB[x.rar]+'</b>'+x.name+'</div>').join('')+'</div><div class="tap">タップで閉じる</div>';await waitTap()}
 ov.classList.remove('on');ov.innerHTML='';save();draw();busy=false;
}
function showResult(o){
 ov.style.setProperty('--oc','#ffcf40');ov.onclick=null;
 ov.innerHTML='<div class="rs"><h2>📋 リザルト</h2><div class="rh">'+o.head+'</div><div class="bt">賭けたキャラ: '+pic(o.bet)+' '+o.bet.name+'</div>'
  +'<div class="blk"><div class="lb">出したキャラ</div>'+o.out+'</div>'
  +'<div class="blk g"><div class="lb">🎁 得たもの</div>'+o.gain+'</div>'
  +'<div class="blk l"><div class="lb">💔 失ったもの</div>'+o.lose+'</div>'
  +'<div class="bs">'+(o.cont?'<button class="go b" id="rcont">このキャラで続けて賭ける</button>':'')+'<button class="sm" id="rback" style="margin:0">選択画面に戻る</button></div></div>';
 document.getElementById('rback').onclick=()=>{ov.classList.remove('on');ov.innerHTML='';busy=false;openBet()};
 const c=document.getElementById('rcont');
 if(c)c.onclick=()=>{busy=false;bet=o.cont;bcat=o.cats.slice();reuse=o.cats.slice();ov.innerHTML='';gamble()};
}
const md=document.getElementById('md');
function openMd(h){md.innerHTML='<div class="in"><button class="x" id="cx">閉じる</button>'+h+'</div>';md.classList.add('on');md.scrollTop=0;document.getElementById('cx').onclick=()=>md.classList.remove('on')}
const fmt=v=>v>=10?v.toFixed(1):v.toFixed(2);
document.getElementById('bp').onclick=()=>{const {cats,info}=rates();
 let h='<h3>📊 排出確率(現在の設定)</h3><p class="note">先にカテゴリを決め、次にそのカテゴリ内でレアリティ、最後にキャラを決めます。カテゴリのキャラ数は確率に影響しません。</p>';
 if(!cats.length)h+='<p>排出対象がありません</p>';
 else h+='<h3>カテゴリ</h3><table><tr><th>カテゴリ</th><th>確率</th></tr>'+cats.map(c=>'<tr><td><b>'+c+'</b></td><td>'+fmt(info[c].cp)+'%</td></tr>').join('')+'</table>';
 cats.forEach(c=>{const i=info[c];h+='<h3>'+c+' 内のレアリティ</h3><table><tr><th>レア</th><th>確率</th><th>体数</th><th>1体あたり(全体)</th></tr>';
  for(const r of ORD.slice().reverse()){h+='<tr style="color:'+COL[r]+'"><td><b>'+LAB[r]+'</b></td><td>'+(i.cnt[r]?fmt(i.eff[r])+'%':'-')+'</td><td>'+i.cnt[r]+'</td><td>'+(i.cnt[r]?fmt(i.cp*i.eff[r]/100/i.cnt[r])+'%':'-')+'</td></tr>'}h+='</table>'});
 h+='<p class="note" style="margin-top:10px">基本のレア割合: '+ORD.slice().reverse().map(r=>r+' '+RATE[r]+'%').join(' / ')+'(カテゴリ内にいないレアは除いて再計算)</p>';openMd(h)};
document.getElementById('bl').onclick=()=>{const {info}=rates();let h='<h3>📖 排出キャラ一覧('+pool().length+'体 / 全'+ALL.length+'体)</h3>';
 for(const cat of ['T','A','J']){const l=ALL.filter(x=>x.cat===cat).sort((a,b)=>ORD.indexOf(b.rar)-ORD.indexOf(a.rar));
  h+='<h3>'+cat+'<span class="badge">'+(on[cat]?'出る':'出ない')+'</span><span class="badge">図鑑 '+l.filter(x=>seen[x.name]).length+'/'+l.length+'</span> <button class="sm fill" data-c="'+cat+'" style="margin:0 0 0 6px;padding:5px 10px;font-size:12px">全て埋める</button><button class="sm clr" data-c="'+cat+'" style="margin:0 0 0 6px;padding:5px 10px;font-size:12px">全て取り消す</button></h3>';
  for(const x of l){const o=ok(x),i=info[cat];h+='<div class="row'+(o?'':' off')+'"><span class="em">'+pic(x)+'</span><span class="nm">'+(seen[x.name]?'✅ ':'')+x.name+'</span><span class="rt" style="color:'+COL[x.rar]+'">'+x.rar+'</span><span class="pc">'+(o?fmt(i.cp*i.eff[x.rar]/100/i.cnt[x.rar])+'%':'出ない')+'</span></div>'}}
 openMd(h);md.querySelectorAll('.fill').forEach(b=>b.onclick=()=>{ALL.filter(x=>x.cat===b.dataset.c).forEach(x=>seen[x.name]=1);save();draw();document.getElementById('bl').onclick()});md.querySelectorAll('.clr').forEach(b=>b.onclick=()=>{ALL.filter(x=>x.cat===b.dataset.c).forEach(x=>{delete seen[x.name]});save();draw();document.getElementById('bl').onclick()})};
const WIN={R:33,SR:50,SSR:66,UR:66,LR:66};
const RO=ORD.map(r=>({rar:r,emo:'🎫',name:r+'(レア度のみ)',cat:null,ro:true}));let bet=null,bcat=[],reuse=null,streak=[];
function updBet(){const o=['T','A','J'].filter(c=>on[c]&&(c!==bet.cat||(reuse&&reuse.includes(c))));bcat=bcat.filter(c=>o.includes(c));
 document.getElementById('bsel').innerHTML='選択中: '+pic(bet)+' '+bet.name+' <small style="font-weight:400;color:var(--sub)">当たり'+WIN[bet.rar]+'% / 出すカテゴリは1つでも両方でもOK</small>';
 const b=document.getElementById('bcat');b.innerHTML=o.length?'':'<span class="note">選べる他のカテゴリがありません(設定でONにしてね)</span>';
 o.forEach(c=>{const on_=bcat.includes(c),e=document.createElement('button');e.className=on_?'on':'';e.innerHTML=c+'<small>'+(on_?'選択中':'から出す')+'</small>';e.onclick=()=>{bcat=on_?bcat.filter(x=>x!==c):bcat.concat(c);updBet()};b.appendChild(e)});
 if(o.length>1){const all=bcat.length===o.length,e=document.createElement('button');e.className=all?'on':'';e.innerHTML='両方<small>'+(all?'選択中':'から出す')+'</small>';e.onclick=()=>{bcat=all?[]:o.slice();updBet()};b.appendChild(e)}}
document.getElementById('bg').onclick=()=>openBet();
function openBet(pre,cats){
 if(busy)return;if(!pool().length){alert('排出対象がありません。設定をONにしてください');return}
 bet=null;bcat=[];reuse=null;
 let h='<h3>🎲 ギャンブル</h3><p class="note">図鑑からキャラを1体選んで勝負!当たり確率はレア度で変わります(R 33% / SR 50% / SSR以上 66%)。当たると、選んだキャラ以外のカテゴリから1つ、または両方を選んでガチャを引けます(両方なら半々)。外れるとここで終了です。</p>';
 for(const cat of ['T','A','J']){const l=pool().filter(x=>x.cat===cat).sort((a,b)=>ORD.indexOf(b.rar)-ORD.indexOf(a.rar));if(!l.length)continue;
  h+='<h3>'+cat+'</h3>'+l.map(x=>'<div class="row" data-n="'+x.name+'"><span class="em">'+pic(x)+'</span><span class="nm">'+(seen[x.name]?'✅ ':'')+x.name+'</span><span class="rt" style="color:'+COL[x.rar]+'">'+x.rar+'</span></div>').join('')}
 h+='<h3>レア度のみ<span class="badge">排出されません</span></h3>'+RO.map(x=>'<div class="row" data-n="'+x.name+'"><span class="em">'+pic(x)+'</span><span class="nm">'+x.name+'</span><span class="rt" style="color:'+COL[x.rar]+'">'+x.rar+'</span></div>').join('');
 h+='<div style="height:260px"></div><div class="ft"><div id="bsel" style="font-weight:700;margin-bottom:6px">キャラを選んでね</div><div id="bcat" class="tg"></div><button class="go" id="bgo" style="width:100%;margin-top:10px;padding:14px">勝負する!</button></div>';
 openMd(h);
 md.querySelectorAll('.row[data-n]').forEach(el=>el.onclick=()=>{md.querySelectorAll('.row.sel').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');bet=ALL.concat(RO).find(x=>x.name===el.dataset.n);bcat=[];reuse=null;updBet()});
 document.getElementById('bgo').onclick=()=>{if(!bet){alert('キャラを選んでね');return}if(!bcat.length){alert('出すカテゴリを選んでね');return}streak=[];gamble()};
 if(pre){bet=pre;reuse=cats||null;bcat=(cats||[]).slice();md.querySelectorAll('.row[data-n]').forEach(e=>{if(e.dataset.n===pre.name)e.classList.add('sel')});updBet()}
}
async function gamble(){
 busy=true;md.classList.remove('on');ov.classList.add('on');ov.style.setProperty('--oc','#ffcf40');ov.onclick=null;
 const wb=bet,cats=bcat.slice();
 ov.innerHTML='<div style="font-size:18px;margin-bottom:10px">'+pic(wb)+' '+wb.name+' で賭け中…</div><div class="coin">🪙</div><div class="tap" style="animation:none">当たり確率 '+WIN[wb.rar]+'%…</div>';
 await sleep(500);if(navigator.vibrate)navigator.vibrate(20);await sleep(1400);
 if(Math.random()*100<WIN[wb.rar]){
  ov.innerHTML='<div class="flash"></div><div class="rays"></div><div class="res" style="color:#e39a00;position:relative">🎉 当たり!! 🎉</div><div class="tap" style="animation:none">ガチャを引きます…</div>';
  if(navigator.vibrate)navigator.vibrate([60,40,120]);await sleep(1600);busy=false;run(1,cats,true);
 }else{
  ov.style.setProperty('--oc','#6b7280');
  const both=cats.length>1,wasSeen=!wb.ro&&!!seen[wb.name];
  if(!wb.ro){delete seen[wb.name];save();draw()}
  ov.innerHTML='<div class="res lose" style="color:#6b7280">💀 外れ… 💀</div><div class="tap">タップで続ける</div>';
  if(navigator.vibrate)navigator.vibrate(300);
  await waitTap();
  let to=null;
  if(both){to=cats[Math.floor(Math.random()*cats.length)];ov.style.setProperty('--oc','#ff9f6b');
   ov.innerHTML='<div class="flash"></div><div class="res" style="color:#ee6a1f;font-size:34px">'+to+' が出てきた!</div>'+(wb.ro?'':'<div class="rc"><div class="e">'+pic(wb)+'</div><div class="n">'+wb.name+'</div><div class="c">→ '+to+' へ譲渡</div></div>')+'<div class="tap">タップでリザルトへ</div>';
   await waitTap()}
  const got=streak.slice(0,-1);
  showResult({head:'💀 外れ…'+(streak.length?'('+streak.length+'連勝のあと)':''),bet:wb,
   out:streak.length?streak.map(s=>chip(s.x)).join('<hr class="sp">')+(both?'<div class="sub2">('+to+' に譲渡されました)</div>':''):(both?none('キャラは出ませんでした<br>('+to+' に譲渡されました)'):none('なし(ガチャは引けませんでした)')),
   gain:got.length?got.map(s=>chip(s.x)+'<div class="sub2">'+(s.isNew?'NEW! 図鑑に追加':'所持済み(図鑑は変わらず)')+'</div>').join('<hr class="sp">'):none(streak.length?'なし(連続で出たキャラは賭けで失いました)':'なし'),
   lose:chip(wb)+'<div class="sub2">賭けに失敗したキャラ'+(both?' / '+to+' へ譲渡':'')+' / '+(wb.ro?'レア度のみなので図鑑は変わらず':wasSeen?'図鑑の✅が外れました':'未所持だったので図鑑は変わらず')+'</div>',
   cont:null});
 }
}
document.getElementById('g1').onclick=()=>run(1);
document.getElementById('g10').onclick=()=>run(10);
document.getElementById('g10s').onclick=()=>run(10,undefined,false,true);
draw();
</script>
</body></html>
